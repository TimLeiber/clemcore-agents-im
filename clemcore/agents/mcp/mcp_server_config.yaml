# instructions shown to the external agent when it connects to the bridge
instructions: |-
  This MCP server exposes game actions as tools.

  The available game actions are tools, not resources:
  - start_game: call this tool exactly once as your first tool call.
  - submit_response: call this tool with {"response": "..."} for every game move.

  Do not call read_mcp_resource for start_game or submit_response.
  Calling start_game more than once aborts the episode.
  Continue with submit_response until the returned result says done=true.
